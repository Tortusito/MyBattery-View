name: Build Windows Executable

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish Light (.exe ~1-2MB, requires .NET 8 Desktop Runtime)
        run: dotnet publish MyBatteryView.csproj -c Release -r win-x64 --no-self-contained -o publish/light

      - name: Rename Light Executable
        shell: pwsh
        run: Move-Item publish/light/MyBatteryView.exe publish/MyBatteryView-light.exe

      - name: Publish Portable (single .exe, no runtime needed)
        run: dotnet publish MyBatteryView.csproj -c Release -r win-x64 --self-contained true -p:PublishTrimmed=false -p:EnableCompressionInSingleFile=true -o publish/portable

      - name: Rename Portable Executable
        shell: pwsh
        run: Move-Item publish/portable/MyBatteryView.exe publish/MyBatteryView-portable.exe

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MyBatteryView-win-x64
          path: |
            publish/MyBatteryView-light.exe
            publish/MyBatteryView-portable.exe

      - name: Create or Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MyBatteryView (Windows x64)
          prerelease: false
          files: |
            publish/MyBatteryView-light.exe
            publish/MyBatteryView-portable.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
